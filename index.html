<!DOCTYPE html>

<title>Проклятый склеп</title>
<style>
:root{--bg:#0a080e;--fg:#d8c8a8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a080e;--fg:#d8c8a8}}
:root[data-theme="dark"]{--bg:#0a080e;--fg:#d8c8a8}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:system-ui,sans-serif}
#w{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;box-sizing:border-box;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);background:var(--bg)}
#w:fullscreen,#w:-webkit-full-screen{width:100vw;height:100vh;height:100dvh;inset:0;background:var(--bg)}
body.game-fullscreen-fallback #w{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;z-index:9999;background:var(--bg)}
canvas{width:100%;height:100%;object-fit:contain;display:block;image-rendering:pixelated}
#rot{display:none;position:absolute;inset:0;background:var(--bg);align-items:center;justify-content:center;text-align:center;font-size:20px;padding:20px}
@media (orientation:portrait){#rot{display:flex}}

#screenSettings{position:fixed;z-index:20;top:calc(env(safe-area-inset-top, 8px) + 8px);right:calc(env(safe-area-inset-right, 8px) + 8px);font:14px system-ui,sans-serif;color:#f2e6ce;touch-action:manipulation}
#screenSettings button{font:inherit;color:inherit;background:#241a2b;border:1px solid #9a795c;border-radius:8px;padding:9px 12px;cursor:pointer}
#screenSettings button:focus-visible{outline:2px solid #ffe08a;outline-offset:2px}
#screenSettings .gear{background:rgba(20,14,25,.92);font-weight:700}
#screenPanel{display:none;position:absolute;right:0;top:46px;width:min(290px,calc(100vw - 24px));box-sizing:border-box;padding:14px;background:rgba(15,11,20,.97);border:1px solid #9a795c;border-radius:12px;box-shadow:0 8px 30px #000a}
#screenPanel.open{display:block}
#screenPanel h2{font-size:17px;margin:0 0 10px}
#screenPanel p{margin:8px 0;color:#c9bba8;font-size:12px;line-height:1.35}
#screenPanel .modes{display:grid;grid-template-columns:1fr 1fr;gap:7px}
#screenPanel button.active{background:#65402c;border-color:#f0c77c}
#screenPanel .actions{display:flex;gap:7px;margin-top:9px}
#screenPanel .actions button{flex:1}
@media(max-width:520px){#screenSettings{top:calc(env(safe-area-inset-top, 4px) + 4px);right:calc(env(safe-area-inset-right, 4px) + 4px)}#screenSettings .gear{padding:7px 10px}}

</style></head><body>
<div id="w"><canvas id="c" width="960" height="640"></canvas>
<div id="screenSettings">
  <button class="gear" id="screenToggle" type="button" aria-expanded="false" aria-controls="screenPanel">⚙ Экран</button>
  <section id="screenPanel" aria-label="Настройки экрана">
    <h2>Настройки экрана</h2>
    <div class="modes">
      <button type="button" data-mode="eco">Экономный</button>
      <button type="button" data-mode="standard">Стандартный</button>
      <button type="button" data-mode="high">Высокое качество</button>
      <button type="button" data-mode="auto">Автоматически</button>
    </div>
    <p id="screenModeInfo">Режим: автоматически</p>
    <p style="margin-bottom:5px">Формат экрана</p>
    <div class="modes" id="ratioModes">
      <button type="button" data-ratio="original">Оригинал 3:2</button>
      <button type="button" data-ratio="16:9">Широкий 16:9</button>
    </div>
    <div class="actions">
      <button id="fullscreenToggle" type="button">Полный экран</button>
      <button id="screenClose" type="button">Закрыть</button>
    </div>
    <p>Игровая сцена сохраняет базовую сетку 960 × 640; режимы меняют частоту кадров и сглаживание отображения.</p>
  </section>
</div>
</div>
<div id="rot">Поверни телефон горизонтально ↻</div>

<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');

const screenToggle=document.getElementById('screenToggle');
const screenPanel=document.getElementById('screenPanel');
const screenModeInfo=document.getElementById('screenModeInfo');
const modeButtons=[...document.querySelectorAll('[data-mode]')];
let screenMode='auto', frameLimit=0, lastPaint=0;
function applyScreenMode(mode){
  screenMode=mode;
  const dpr=Math.max(1,window.devicePixelRatio||1);
  const modes={
    eco:{label:'Экономный · 30 кадров/с',fps:30,smoothing:false},
    standard:{label:'Стандартный · 60 кадров/с',fps:60,smoothing:false},
    high:{label:'Высокое качество · до 60 кадров/с',fps:60,smoothing:true},
    auto:{label:`Автоматически · ${dpr.toFixed(1)}× экран`,fps:dpr<1.5?30:60,smoothing:dpr>=2}
  };
  const cfg=modes[mode]||modes.auto;
  frameLimit=1000/cfg.fps;
  g.imageSmoothingEnabled=cfg.smoothing;
  cv.style.imageRendering=cfg.smoothing?'auto':'pixelated';
  screenModeInfo.textContent='Режим: '+cfg.label;
  modeButtons.forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
  try{localStorage.setItem('cryptScreenMode',mode)}catch(e){}
}
try{const saved=localStorage.getItem('cryptScreenMode');if(saved&&['eco','standard','high','auto'].includes(saved))screenMode=saved}catch(e){}
applyScreenMode(screenMode);

const ratioButtons=[...document.querySelectorAll('[data-ratio]')];
let screenRatio='original';
try {
  const savedRatio=localStorage.getItem('cryptScreenRatio');
  if(savedRatio==='16:9') screenRatio='16:9';
} catch(e) {}
function applyScreenRatio(ratio){
  screenRatio=ratio;
  // 16:9 stretches the game canvas to a widescreen frame; original preserves the source ratio.
  cv.style.objectFit=ratio==='16:9'?'fill':'contain';
  cv.style.width='100%';
  cv.style.height='100%';
  ratioButtons.forEach(b=>b.classList.toggle('active',b.dataset.ratio===ratio));
  try{localStorage.setItem('cryptScreenRatio',ratio)}catch(e){}
}
applyScreenRatio(screenRatio);

screenToggle.addEventListener('click',e=>{
  e.preventDefault();e.stopPropagation();
  const open=!screenPanel.classList.contains('open');
  screenPanel.classList.toggle('open',open);
  screenToggle.setAttribute('aria-expanded',String(open));
});
modeButtons.forEach(b=>b.addEventListener('click',e=>{
  e.preventDefault();e.stopPropagation();applyScreenMode(b.dataset.mode);
}));
ratioButtons.forEach(b=>b.addEventListener('click',e=>{
  e.preventDefault();e.stopPropagation();applyScreenRatio(b.dataset.ratio);
}));
document.getElementById('screenClose').addEventListener('click',e=>{
  e.preventDefault();e.stopPropagation();screenPanel.classList.remove('open');screenToggle.setAttribute('aria-expanded','false');
});
const gameRoot=document.getElementById('w');
const fullscreenBtn=document.getElementById('fullscreenToggle');
function gameIsFullscreen(){
  return document.fullscreenElement===gameRoot || document.webkitFullscreenElement===gameRoot ||
    document.mozFullScreenElement===gameRoot || document.msFullscreenElement===gameRoot ||
    document.body.classList.contains('game-fullscreen-fallback');
}
function syncFullscreenButton(){
  const active=gameIsFullscreen();
  fullscreenBtn.textContent=active?'Выйти из полного экрана':'Полный экран';
  fullscreenBtn.setAttribute('aria-pressed',String(active));
}
fullscreenBtn.addEventListener('click',async e=>{
  e.preventDefault();e.stopPropagation();
  try{
    if(gameIsFullscreen()){
      if(document.exitFullscreen) await document.exitFullscreen();
      else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
      else if(document.mozCancelFullScreen) document.mozCancelFullScreen();
      else if(document.msExitFullscreen) document.msExitFullscreen();
      document.body.classList.remove('game-fullscreen-fallback');
    }else{
      const enter=gameRoot.requestFullscreen||gameRoot.webkitRequestFullscreen||gameRoot.mozRequestFullScreen||gameRoot.msRequestFullscreen;
      if(enter){await enter.call(gameRoot);}
      else {document.body.classList.add('game-fullscreen-fallback');}
      try{if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock('landscape');}catch(_){/* orientation lock is optional */}
    }
  }catch(err){
    // Fallback still expands the actual game surface when native fullscreen is blocked.
    document.body.classList.add('game-fullscreen-fallback');
    screenModeInfo.textContent='Игра развернута на весь экран страницы. Для скрытия панели браузера на iPhone добавь игру на экран Домой.';
  }
  syncFullscreenButton();
});
['fullscreenchange','webkitfullscreenchange','mozfullscreenchange','MSFullscreenChange'].forEach(name=>document.addEventListener(name,syncFullscreenButton));

const W=960,H=640,T=40,C=24,R=16;
// ---------- карты трёх глав
function buildMap(index){
 const a=Array.from({length:R},()=>Array(C).fill(1));
 const cr=(x1,y1,x2,y2)=>{for(let y=y1;y<=y2;y++)for(let x=x1;x<=x2;x++)a[y][x]=0};
 const h=(x1,x2,y)=>cr(x1,y,x2,y),v=(x,y1,y2)=>cr(x,y1,x,y2);
 if(index===0){
  [[1,1,6,5],[9,1,15,4],[18,1,22,6],[1,8,7,13],[10,7,15,11],[17,9,22,14],[7,3,8,3],[16,2,17,2],[3,6,3,7],[12,5,12,6],[20,7,20,8],[8,10,9,10],[16,10,16,10]].forEach(r=>cr(...r));
  [[11,2],[14,2],[3,12],[5,10],[12,9],[13,9],[19,11],[21,11],[19,13],[21,13],[19,3],[21,3],[19,5],[21,5]].forEach(([x,y])=>a[y][x]=1);
 }else if(index===1){
  [[1,1,6,5],[9,1,14,5],[17,1,22,5],[1,9,6,14],[9,8,14,13],[17,9,22,14]].forEach(r=>cr(...r));
  h(6,9,3);h(14,17,3);v(3,5,9);v(11,5,8);v(20,5,9);h(6,9,11);h(14,17,11);
  [[2,2],[5,4],[11,2],[13,4],[19,2],[21,4],[2,11],[5,12],[11,10],[13,12],[19,10],[21,13]].forEach(([x,y])=>a[y][x]=1);
 }else{
  [[1,1,5,5],[8,1,14,5],[18,1,22,5],[1,10,5,14],[8,9,15,14],[18,10,22,14]].forEach(r=>cr(...r));
  h(5,8,3);h(14,18,3);v(3,5,10);v(11,5,9);v(20,5,10);h(5,8,12);h(15,18,12);
  [[2,2],[4,4],[10,2],[13,4],[19,2],[21,4],[2,12],[4,13],[9,11],[14,12],[19,11],[21,13]].forEach(([x,y])=>a[y][x]=1);
 }
 return a;
}
let M=buildMap(0);
const wall=(x,y)=>x<0||y<0||x>=C||y>=R||M[y][x]===1;
const blocked=(x,y,r)=>[-r,r].some(dx=>[-r,r].some(dy=>wall(Math.floor((x+dx)/T),Math.floor((y+dy)/T))));
const mv=(o,dx,dy)=>{if(!blocked(o.x+dx,o.y,o.r))o.x+=dx;if(!blocked(o.x,o.y+dy,o.r))o.y+=dy};
const rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1));
const adiff=(a,b)=>{let d=(a-b)%(2*Math.PI);if(d>Math.PI)d-=2*Math.PI;if(d<-Math.PI)d+=2*Math.PI;return d};
// ---------- пиксель-арт
const ART={
skeleton:["................",".....bbbbbb.....","....bbbbbbbb....","....bddbbddb....","....bdrbbdrb....","....bbbbbbbb....",".....bbddbb.....","......bbbb......","....bbbbbbbb.gg.","...b.bddbdb..gg.","...b.bbbbbb..g..","...b.bddbdb.gg..","....bbbbbbbg.g..",".....bb..bb.g...",".....bb..bb.....","....bbb..bbb...."],
ghoul:["................","......gggg......",".....gggggg.....",".....gyggyg.....",".....gggggg.....","......gddg......","....gggggggg....","...gggggggggg...","..ggg.gggggg.ggg","..gg..gggggg..gg","..cc..gggggg..cc","......gg..gg....","......gg..gg....",".....ggg..ggg...","................","................"],
shade:["................",".....pppppp.....","....pppppppp....","...pppqqqqppp...","...ppqwqqwqpp...","...pppqqqqppp...","...pppppppppp...","..pppppppppppp..","..pppppppppppp..","..pppppppppppp..","...pppppppppp...","...pppppppppp...","..ppp.pppp.ppp..","..pp...pp...pp..","..p....pp....p..","................"],
knight:["......rr........",".....ssss.......","....ssSSss......","....sddddS......","....ssssss......","...ssssssss..w..","..sssSSSsss..w..","..ss.ssss.s..w..","..ss.ssss.sbbw..","..kk.ssss.kkbw..",".....ssss....w..",".....ssss....b..",".....s..s....b..",".....s..s.......","....dd..dd......","....dd..dd......"],
mage:[".......h........","......hhh.......",".....hhhhh......","....hhhhhhh.....","...hhhhhhhhh....",".....kkkk....yy.",".....kdkdk...yy.",".....kkkk.....b.","....uuuuuu....b.","...uuUuuUuu...b.","...uuuuuuuu...b.","..kuuuuuuuuk..b.","...uuuuuuuu...b.","...uuuuuuuuu..b.","..uuuuuuuuuu....","..uuuuuuuuuu...."],
assassin:["................",".....vvvvvv.....","....vvvvvvvv....","....vvkkkkvv....","....vvkrkrvv....","....vvvvvvvv....",".....rrrrrr.....","....vvvvvvvv.w..","...vvVvvvvVvvw..","...vv.vvvv.vk...","...kk.vvvv......",".....vvvvvv.....",".....vv..vv.....",".....vv..vv.....","....vvv..vvv....","....bbb..bbb...."],
boss:["....y.y.y.y.....","....yyyyyyy.....","....bbbbbbb...o.","...bbbbbbbbb..o.","...bbeebbeeb..a.","...bbebbbbeb..a.","....bbbbbbb...a.",".....bbbbb....a.","...pppppppppp.a.","..ppqpppppqppppa","..pppqpppqppp.a.",".pppppqpqpppp.a.",".ppqpppqpppqp.a.",".pppppppppppp.a.","pppqpppppppppp..","pppppppppppppp.."],
boss2:["....r...r.......","...rrrrrrrr.....","..rrrrrrrrrr....","..rrbbbbbbrr....",".rrbbbbeebbrr...",".rrbbebbbebbr...","..rrbbbbbbrr....","...rrbbbbrr.....","..aaaaaaaaatt...",".aaaaattaaaatt..",".aaataaaataaaat.","aaaatataaaataaa.",".aaaaaataaaaata.","..aaaa..aaaa....",".rrr......rrr...","rr..........rr.."],
boss3:["....w...w.......","...wwwwwww......","..wwbbbbwww.....",".wwbwwwwwbww....",".wwbeebeebww....",".wwbbbbbbbww....","..wwwwwwwww.....","...wwwwwww......","..pppppppppp....",".pppqqpppqqpp...","pppppppppppppp..","ppqppppppppqppp.","ppppppqqppppppp.","..ppppppppppp...","..ppp....ppp....",".ww..........ww."]};
const PAL={
skeleton:{b:'#d6ceb0',d:'#16121a',r:'#ff3c2d',g:'#9696a5'},
ghoul:{g:'#688054',d:'#1e1418',y:'#f5e13c',c:'#e1e1cd'},
shade:{p:'rgba(120,66,190,.84)',q:'#180a28',w:'#f0f0ff'},
knight:{s:'#969baa',S:'#cdd2e1',d:'#14141e',k:'#e0ac82',r:'#be2328',b:'#6e4628',w:'#f0f4ff'},
mage:{u:'#3c50aa',U:'#6e8ce6',h:'#282d6e',k:'#e0ac82',d:'#14141e',y:'#ffdc5a',b:'#6e4628'},
assassin:{v:'#323442',V:'#505468',r:'#be2328',k:'#e0ac82',w:'#ebf0fa',b:'#1e1e24'},
boss:{p:'#581e8c',q:'#340e56',b:'#ded8be',y:'#ecc430',e:'#5aff64',a:'#6e4c30',o:'#78ff82'},
boss2:{r:'#a52b20',b:'#c9a16b',e:'#fff18a',a:'#6b3427',t:'#ff7b2b'},
boss3:{w:'#91e9f2',b:'#e6f7fa',e:'#68ffff',p:'#527bb8',q:'#1b315e'}};
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const S={};
for(const k in ART){const s=k.startsWith('boss')?5:3,c=mk(16*s,16*s),x=c.getContext('2d');
ART[k].forEach((row,y)=>{for(let i=0;i<16;i++){const q=PAL[k][row[i]];if(q){x.fillStyle=q;x.fillRect(i*s,y*s,s,s)}}});
const fl=mk(c.width,c.height),fx=fl.getContext('2d');fx.translate(c.width,0);fx.scale(-1,1);fx.drawImage(c,0,0);
const f=(a)=>{const d=mk(a.width,a.height),y=d.getContext('2d');y.drawImage(a,0,0);y.globalCompositeOperation='source-atop';y.fillStyle='rgba(255,255,255,.6)';y.fillRect(0,0,a.width,a.height);return d};
S[k]=[fl,c,f(fl),f(c)]} // [влево, вправо, влево-вспышка, вправо-вспышка]
// ---------- предрисовка карты и света
const MAPC=mk(W,H);
function renderMap(index){
 const x=MAPC.getContext('2d');x.clearRect(0,0,W,H);
 const wallColors=['#221e28','#33251f','#1b2936'];
 const floorBases=[[46,42,52],[62,46,37],[35,48,60]];
 let sd=7+index*173;const r=()=>(sd=(sd*16807)%2147483647)/2147483647;
 for(let ty=0;ty<R;ty++)for(let tx=0;tx<C;tx++){
  const X=tx*T,Y=ty*T;
  if(M[ty][tx]){
   x.fillStyle=wallColors[index];x.fillRect(X,Y,T,T);
   for(let row=0;row<2;row++)for(let b=-1;b<3;b++){
    const v=Math.floor(r()*14-6),rx=X+b*20+(row?10:0),ry=Y+row*20;
    const x0=Math.max(rx,X),x1=Math.min(rx+18,X+T);
    if(x1>x0){const base=index===0?[78,70,88]:index===1?[91,64,51]:[57,80,101];
     x.fillStyle=`rgb(${base[0]+v},${base[1]+v},${base[2]+v})`;x.fillRect(x0,ry,x1-x0,18);
     x.fillStyle='rgba(255,255,255,.1)';x.fillRect(x0,ry,x1-x0,1)}
   }
  }else{
   const v=Math.floor(r()*11-5),base=floorBases[index];
   x.fillStyle=`rgb(${base[0]+v},${base[1]+v},${base[2]+v})`;x.fillRect(X,Y,T,T);
   x.strokeStyle='rgba(0,0,0,.25)';x.strokeRect(X+.5,Y+.5,T-1,T-1);
   for(let i=0;i<3;i++){x.fillStyle='rgba(0,0,0,.18)';x.fillRect(X+3+r()*34,Y+3+r()*34,2,2)}
   if(index===1&&((tx*7+ty*11)%13===0)){x.fillStyle='rgba(255,105,43,.38)';x.fillRect(X+18,Y+18,4,4)}
   if(index===2&&((tx*5+ty*9)%11===0)){x.fillStyle='rgba(109,220,255,.42)';x.fillRect(X+17,Y+17,6,6)}
   if(wall(tx,ty-1)){const gr=x.createLinearGradient(0,Y,0,Y+10);gr.addColorStop(0,'rgba(0,0,0,.45)');gr.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=gr;x.fillRect(X,Y,T,10)}
  }
 }
}
renderMap(0);
const DK=mk(W,H),dg=DK.getContext('2d');
// ---------- данные
const SP=[['skeleton',10,3],['skeleton',14,4],['ghoul',20,2],['ghoul',4,11],['skeleton',6,9],['shade',13,10],['shade',11,8],['ghoul',22,5],['skeleton',15,1],['boss',20,12]];
const PO=[[6,5],[15,1],[22,1],[1,13],[15,11],[18,14]];
const CL=[{n:'Рыцарь',hp:120,atk:16,def:4,sp:165,cd:.45,melee:1,reach:64,arc:110,s:'knight',d:'Меч: удар по дуге, много HP'},
{n:'Маг',hp:80,atk:22,def:1,sp:160,cd:.55,melee:0,reach:0,arc:0,s:'mage',d:'Огненные шары издалека'},
{n:'Убийца',hp:95,atk:14,def:2,sp:195,cd:.24,melee:1,reach:48,arc:150,s:'assassin',d:'Кинжалы: быстрый и ловкий'}];
const ET={skeleton:{n:'Скелет-страж',hp:40,atk:9,sp:88,souls:20,r:15},ghoul:{n:'Голодный гуль',hp:55,atk:11,sp:105,souls:25,r:15},
shade:{n:'Шепчущая тень',hp:45,atk:13,sp:125,souls:30,r:14},
boss:{n:'Лич Мортас, Повелитель Праха',hp:260,atk:18,sp:62,souls:200,r:30},
boss2:{n:'Громар, Страж Раскалённых Врат',hp:355,atk:20,sp:58,souls:260,r:32},
boss3:{n:'Иллария, Ледяная Королева',hp:470,atk:23,sp:78,souls:360,r:34}};
const LEVELS=[
 {name:'Проклятый склеп',boss:'boss',spawn:[3,3],spawns:SP,potions:PO},
 {name:'Катакомбы Раскалённого легиона',boss:'boss2',spawn:[3,3],
  spawns:[['skeleton',10,3],['ghoul',4,3],['shade',20,3],['skeleton',3,11],['ghoul',10,10],['shade',19,11],['ghoul',12,4],['skeleton',4,12],['boss2',20,12]],
  potions:[[5,2],[11,4],[3,13],[13,11],[19,4],[18,13]]},
 {name:'Ледяное святилище',boss:'boss3',spawn:[3,3],
  spawns:[['shade',4,3],['ghoul',11,2],['skeleton',20,3],['shade',3,12],['ghoul',11,11],['skeleton',18,11],['shade',12,4],['ghoul',18,12],['boss3',20,13]],
  potions:[[2,4],[10,3],[20,3],[4,12],[13,13],[19,12]]}
];
const isBoss=k=>k==='boss'||k==='boss2'||k==='boss3';
const ATK=[W-120,H-125,72],POT=[W-255,H-85,46],SH=[135,H-135],SR=70;
// ---------- состояние и ввод
